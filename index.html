<!doctype html>
<html lang="fr">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Scan carte NFL</title>

<style>
:root{
  --bg:#0b0c10;
  --fg:#f3f4f6;
  --muted: rgba(243,244,246,.72);
  --accent:#22c55e;
  --danger:#ef4444;
  --border: rgba(255,255,255,.18);
}
*{box-sizing:border-box}

body{
  margin:0;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  background: var(--bg);
  color: var(--fg);
  height:100dvh;
  overflow:hidden;
  touch-action: manipulation;
}

/* ===== Header ===== */
header{
  padding: 10px 14px env(safe-area-inset-top);
  display:flex;
  align-items:center;
  justify-content:space-between;
  background: linear-gradient(to bottom, rgba(0,0,0,.7), rgba(0,0,0,0));
  z-index:10;
}
header h2{margin:0;font-size:16px;font-weight:800}
header .sub{font-size:12px;color:var(--muted)}

.app{
  height:100dvh;
  display:flex;
  flex-direction:column;
}

/* ===== Viewer ===== */
.viewer{
  position:relative;
  flex:1 1 auto;
  min-height:55dvh;
  background:#000;
  overflow:hidden;
}
video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

/* ===== Frame ===== */
.frame{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  border:2px solid rgba(255,255,255,.9);
  border-radius:16px;
  box-shadow:0 0 0 9999px rgba(0,0,0,.38);
  pointer-events:none;
}
.frame:after{
  content:"";
  position:absolute;
  inset:12px;
  border:1px dashed rgba(255,255,255,.35);
  border-radius:12px;
}
.frame.mode-card{width:min(88vw,460px);aspect-ratio:5/7}
.frame.mode-slab{width:min(78vw,400px);aspect-ratio:10/16}

/* ===== Vertical Zoom ===== */
.zoomSide{
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  z-index:15;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  background:rgba(0,0,0,.35);
  border:1px solid var(--border);
  border-radius:16px;
  padding:12px 10px;
  backdrop-filter:blur(8px);
}
.zoomSide .zval{
  font-size:12px;
  font-weight:800;
}
.zoomSide input[type="range"]{
  width:180px;
  transform:rotate(-90deg);
}

/* ===== Controls ===== */
.controls{
  background:rgba(0,0,0,.65);
  backdrop-filter:blur(10px);
  border-top:1px solid var(--border);
  padding:12px 12px calc(108px + env(safe-area-inset-bottom));
  overflow-y:auto;
}
@media (max-height:720px){
  .controls{max-height:42dvh}
}

/* ===== Rows ===== */
.row{display:flex;gap:12px;margin:10px 0}

/* ===== Buttons ===== */
button{
  appearance:none;
  border:1px solid var(--border);
  background:rgba(17,24,39,.88);
  color:var(--fg);
  padding:18px;
  border-radius:18px;
  font-size:19px;
  font-weight:800;
  min-height:78px;
  flex:1;
}
button.primary{
  background:rgba(34,197,94,.20);
  border-color:rgba(34,197,94,.55);
}
button.danger{
  background:rgba(239,68,68,.18);
  border-color:rgba(239,68,68,.55);
}
button:disabled{opacity:.45}

/* ===== Segmented ===== */
.seg{
  display:flex;
  width:100%;
  background:rgba(17,24,39,.45);
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
}
.seg button{
  border:none;
  background:none;
  min-height:64px;
  font-size:17px;
}
.seg button.active{
  background:rgba(34,197,94,.22);
}

/* ===== Previews ===== */
.previews{display:flex;gap:10px}
.thumb{
  flex:1;
  background:rgba(17,24,39,.45);
  border:1px solid var(--border);
  border-radius:16px;
  padding:8px;
  display:flex;
  gap:10px;
  align-items:center;
}
.thumb img{
  width:44px;height:44px;border-radius:12px;object-fit:cover;
}
.thumb b{font-size:12px}
.thumb span{font-size:11px;color:var(--muted)}

#status{font-size:13px;color:var(--muted);margin-top:8px}

/* ===== Sticky Send ===== */
.stickyBar{
  position:fixed;
  left:0;right:0;bottom:0;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:rgba(0,0,0,.78);
  border-top:1px solid var(--border);
}
#send{
  min-height:92px;
  font-size:22px;
}
</style>
</head>

<body>
<div class="app">

<header>
  <h2>Scan carte NFL</h2>
  <div class="sub">Recto / Verso</div>
</header>

<div class="viewer" id="viewer">
  <video id="video" autoplay muted playsinline></video>
  <div class="frame mode-card" id="frame"></div>

  <!-- Zoom vertical -->
  <div class="zoomSide hidden" id="zoomSide">
    <div class="zval" id="zoomVal">1.0×</div>
    <input id="zoomRange" type="range" min="1" max="1" step="0.1" value="1">
  </div>
</div>

<div class="controls">
  <div class="row">
    <button id="start" class="primary">Ouvrir la caméra</button>
    <button id="stop" class="danger" disabled>Couper</button>
  </div>

  <div class="row">
    <div class="seg">
      <button id="modeCard" class="active" disabled>Carte</button>
      <button id="modeSlab" disabled>Slab PSA</button>
    </div>
  </div>

  <div class="row">
    <button id="snapFront" disabled>Capturer Recto</button>
    <button id="snapBack" disabled>Capturer Verso</button>
  </div>

  <div class="previews">
    <div class="thumb"><img id="frontPreview"><div><b>Recto</b><span id="frontInfo">—</span></div></div>
    <div class="thumb"><img id="backPreview"><div><b>Verso</b><span id="backInfo">—</span></div></div>
  </div>

  <div id="status"></div>
</div>

<div class="stickyBar">
  <button id="send" class="primary" disabled>Envoyer</button>
</div>

<script>
const WEBHOOK_URL = "https://n8n.srv1119117.hstgr.cloud/webhook-test/scan-carte-nfl";

let stream, track, caps;
let frontBlob=null, backBlob=null;
let mode="card";

const $=id=>document.getElementById(id);

function setMode(m){
  mode=m;
  $("frame").className="frame "+(m==="slab"?"mode-slab":"mode-card");
  $("modeCard").classList.toggle("active",m==="card");
  $("modeSlab").classList.toggle("active",m==="slab");
}

async function startCamera(){
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
  $("video").srcObject=stream;
  track=stream.getVideoTracks()[0];
  caps=track.getCapabilities?.();

  $("stop").disabled=false;
  $("snapFront").disabled=false;
  $("snapBack").disabled=false;
  $("modeCard").disabled=false;
  $("modeSlab").disabled=false;

  if(caps?.zoom){
    const z=$("zoomRange");
    z.min=caps.zoom.min;
    z.max=caps.zoom.max;
    z.step=caps.zoom.step||0.1;
    z.value=caps.zoom.min;
    $("zoomVal").textContent=z.value+"×";
    $("zoomSide").classList.remove("hidden");
    z.oninput=async()=>{
      $("zoomVal").textContent=z.value+"×";
      await track.applyConstraints({advanced:[{zoom:Number(z.value)}]});
    };
  }
}

function stopCamera(){
  stream?.getTracks().forEach(t=>t.stop());
  $("stop").disabled=true;
}

async function capture(){
  const v=$("video");
  const c=document.createElement("canvas");
  c.width=v.videoWidth;c.height=v.videoHeight;
  c.getContext("2d").drawImage(v,0,0);
  return new Promise(r=>c.toBlob(b=>r(b),"image/jpeg",0.9));
}

$("start").onclick=startCamera;
$("stop").onclick=stopCamera;
$("modeCard").onclick=()=>setMode("card");
$("modeSlab").onclick=()=>setMode("slab");
$("snapFront").onclick=async()=>{frontBlob=await capture();$("frontPreview").src=URL.createObjectURL(frontBlob);};
$("snapBack").onclick=async()=>{backBlob=await capture();$("backPreview").src=URL.createObjectURL(backBlob);};
$("send").onclick=async()=>{
  const f=new FormData();
  f.append("front",frontBlob);
  f.append("back",backBlob);
  f.append("capture_mode",mode);
  await fetch(WEBHOOK_URL,{method:"POST",body:f});
};
</script>
</body>
</html>
