<!doctype html>
<html lang="fr">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Scan carte NFL</title>
  <style>
    :root{
      --bg:#0b0c10;
      --fg:#f3f4f6;
      --muted: rgba(243,244,246,.72);
      --accent:#22c55e;
      --danger:#ef4444;
      --border: rgba(255,255,255,.18);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:var(--bg);
      color:var(--fg);
      height:100dvh;
      overflow:hidden;
      touch-action: manipulation;
    }
    .app{ height:100dvh; display:flex; flex-direction:column; }

    header{
      padding: 10px 14px env(safe-area-inset-top);
      display:flex;
      align-items:center;
      justify-content:space-between;
      background: linear-gradient(to bottom, rgba(0,0,0,.75), rgba(0,0,0,0));
      z-index:10;
    }
    header h2{margin:0;font-size:16px;font-weight:900;letter-spacing:.2px}
    header .sub{font-size:12px;color:var(--muted)}

    .viewer{
      position:relative;
      flex:1 1 auto;
      background:#000;
      overflow:hidden;
      touch-action: none;
    }
    video{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      transform: translateZ(0);
    }

    .frame{
      position:absolute;
      left:50%;
      top:54%;
      transform:translate(-50%,-50%);
      border:2px solid rgba(255,255,255,.90);
      border-radius: 14px;
      box-shadow: 0 0 0 9999px rgba(0,0,0,.40);
      pointer-events:none;
    }
    .frame:after{
      content:"";
      position:absolute;
      inset:10px;
      border:1px dashed rgba(255,255,255,.30);
      border-radius: 10px;
    }
    .frame.mode-card{
      width:min(82vw, 460px);
      aspect-ratio: 5 / 7;
    }
    .frame.mode-slab{
      width:min(74vw, 420px);
      aspect-ratio: 10 / 16;
    }
    .frame .topGuide{
      position:absolute;
      left:0; right:0;
      top:18%;
      border-top: 2px solid rgba(255,255,255,.35);
    }

    .stepTitle{
      position:absolute;
      left:50%;
      top: 10px;
      transform:translateX(-50%);
      z-index:12;
      background: rgba(0,0,0,.55);
      border:1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      font-weight:900;
      letter-spacing:.8px;
      text-transform: uppercase;
      font-size: 14px;
      backdrop-filter: blur(8px);
      user-select:none;
    }

    .modePill{
      position:absolute;
      right: 14px;
      bottom: 110px;
      z-index:12;
      background: rgba(0,0,0,.55);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 10px 14px;
      font-weight:900;
      font-size: 14px;
      letter-spacing:.4px;
      backdrop-filter: blur(8px);
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    .modePill.active{
      background: rgba(34,197,94,.20);
      border-color: rgba(34,197,94,.55);
    }

    .hudPill{
      position:absolute;
      right: 12px;
      top: 54px;
      z-index:14;
      background: rgba(0,0,0,.45);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 10px;
      font-weight: 900;
      font-size: 12px;
      letter-spacing:.2px;
      backdrop-filter: blur(8px);
      user-select:none;
    }
    .torchPill{
      position:absolute;
      left: 12px;
      top: 54px;
      z-index:14;
      width: 40px;
      height: 40px;
      border-radius: 999px;
      background: rgba(0,0,0,.45);
      border: 1px solid var(--border);
      color: var(--fg);
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight: 900;
      font-size: 16px;
      backdrop-filter: blur(8px);
      opacity: .92;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    .torchPill.on{
      background: rgba(34,197,94,.22);
      border-color: rgba(34,197,94,.55);
      opacity: 1;
    }

    .closePill{
      position:absolute;
      right: 12px;
      top: 10px;
      z-index:14;
      width: 40px;
      height: 40px;
      border-radius: 999px;
      background: rgba(0,0,0,.45);
      border: 1px solid var(--border);
      color: var(--fg);
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight: 900;
      font-size: 18px;
      backdrop-filter: blur(8px);
      opacity: .92;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    .closePill:active{ transform: scale(.98); }

    #status{
      position:absolute;
      left:12px;
      bottom: 120px;
      z-index:12;
      background: rgba(0,0,0,.35);
      border:1px solid var(--border);
      border-radius: 12px;
      padding: 8px 10px;
      font-size: 12px;
      color: var(--muted);
      backdrop-filter: blur(8px);
      max-width: 74vw;
      user-select:none;
    }

    .shutter{
      position:absolute;
      left:50%;
      bottom: 24px;
      transform:translateX(-50%);
      z-index:12;
      width:84px;
      height:84px;
      border-radius:999px;
      border:4px solid rgba(255,255,255,.95);
      background: rgba(255,255,255,.10);
      box-shadow: 0 10px 30px rgba(0,0,0,.45);
      -webkit-tap-highlight-color: transparent;
    }
    .shutter:active{ transform: translateX(-50%) scale(.98); }

    .review{
      position: fixed;
      left:0; right:0;
      bottom:0;
      z-index:30;
      background: rgba(0,0,0,.82);
      border-top:1px solid var(--border);
      backdrop-filter: blur(10px);
      padding: 12px 12px calc(14px + env(safe-area-inset-bottom));
      transform: translateY(105%);
      transition: transform .18s ease;
    }
    .review.open{ transform: translateY(0); }

    .review h3{
      margin: 0 0 10px 0;
      font-size: 14px;
      letter-spacing:.4px;
      text-transform: uppercase;
      opacity:.9;
    }

    .grid{ display:flex; gap:10px; }
    .card{
      flex:1;
      background: rgba(17,24,39,.55);
      border:1px solid var(--border);
      border-radius: 14px;
      padding: 10px;
      min-width:0;
    }
    .card b{ font-size: 12px; display:block; margin-bottom:8px; opacity:.95 }
    .card img{
      width:100%;
      aspect-ratio: 5/7;
      object-fit: cover;
      border-radius: 12px;
      border:1px solid rgba(255,255,255,.12);
      background:#000;
    }

    .actions{
      display:flex;
      gap:10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    button{
      appearance:none;
      border: 1px solid var(--border);
      background: rgba(17,24,39,.88);
      color: var(--fg);
      padding: 16px 16px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 900;
      min-height: 56px;
      flex:1;
      -webkit-tap-highlight-color: transparent;
    }
    button.primary{
      background: rgba(34,197,94,.20);
      border-color: rgba(34,197,94,.55);
    }
    button.danger{
      background: rgba(239,68,68,.18);
      border-color: rgba(239,68,68,.55);
    }
    button:disabled{ opacity:.45; }

    .hidden{ display:none !important; }
  </style>
</head>

<body>
<div class="app">
  <header>
    <h2>Scan carte NFL</h2>
    <div class="sub">Recto / Verso</div>
  </header>

  <div class="viewer" id="viewer">
    <video id="video" autoplay muted playsinline></video>

    <div class="stepTitle" id="stepTitle">FRONT OF CARD</div>

    <div class="frame mode-card" id="frame" aria-hidden="true">
      <div class="topGuide"></div>
    </div>

    <div class="hudPill hidden" id="zoomHud">1.0×</div>
    <div class="torchPill hidden" id="torchPill" role="button" aria-label="Torche">⚡</div>
    <div class="closePill" id="closePill" role="button" aria-label="Fermer">✕</div>

    <div id="status">Appuie sur le bouton capture pour démarrer (autorise la caméra si demandé).</div>

    <div class="modePill" id="modePill">RAW</div>

    <button class="shutter" id="shutter" title="Capturer" aria-label="Capturer"></button>
  </div>
</div>

<div class="review" id="review" aria-hidden="true">
  <h3>Vérification avant envoi</h3>

  <div class="grid">
    <div class="card">
      <b>Recto</b>
      <img id="frontPreview" alt="Recto">
    </div>
    <div class="card">
      <b>Verso</b>
      <img id="backPreview" alt="Verso">
    </div>
  </div>

  <div class="actions">
    <button id="retakeFront">Reprendre recto</button>
    <button id="retakeBack">Reprendre verso</button>
  </div>

  <div class="actions">
    <button id="send" class="primary" disabled>Envoyer</button>
    <button id="closeReview" class="danger">Annuler</button>
  </div>
</div>

<script>

    return Math.max(min, Math.min(max, v));
  }

  function distance(t1, t2){
    const dx = t1.clientX - t2.clientX;
    const dy = t1.clientY - t2.clientY;
    return Math.hypot(dx, dy);

    const snapped = Math.round((z - zoomMin) / zoomStep) * zoomStep + zoomMin;

    $("zoomHud").textContent = `${currentZoom.toFixed(1)}×`;

    try {
      await track.applyConstraints({ advanced: [{ zoom: currentZoom }] });
    } catch(e) {}
  }
