<!doctype html>
<html lang="fr">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Scan carte NFL</title>
  <style>
    :root{
      --bg:#0b0c10;
      --fg:#f3f4f6;
      --muted: rgba(243,244,246,.72);
      --accent:#22c55e;
      --danger:#ef4444;
      --border: rgba(255,255,255,.18);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:var(--bg);
      color:var(--fg);
      height:100dvh;
      overflow:hidden;
      touch-action: manipulation;
    }
    .app{ height:100dvh; display:flex; flex-direction:column; }

    header{
      padding: 10px 14px env(safe-area-inset-top);
      display:flex;
      align-items:center;
      justify-content:space-between;
      background: linear-gradient(to bottom, rgba(0,0,0,.75), rgba(0,0,0,0));
      z-index:10;
    }
    header h2{margin:0;font-size:16px;font-weight:900;letter-spacing:.2px}
    header .sub{font-size:12px;color:var(--muted)}

    .viewer{
      position:relative;
      flex:1 1 auto;
      background:#000;
      overflow:hidden;
      touch-action: none;
    }
    video{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      transform: translateZ(0);
    }

    .frame{
      position:absolute;
      left:50%;
      top:54%;
      transform:translate(-50%,-50%);
      border:2px solid rgba(255,255,255,.90);
      border-radius: 14px;
      box-shadow: 0 0 0 9999px rgba(0,0,0,.40);
      pointer-events:none;
    }
    .frame:after{
      content:"";
      position:absolute;
      inset:10px;
      border:1px dashed rgba(255,255,255,.30);
      border-radius: 10px;
    }
    .frame.mode-card{
      width:min(82vw, 460px);
      aspect-ratio: 5 / 7;
    }
    .frame.mode-slab{
      width:min(74vw, 420px);
      aspect-ratio: 10 / 16;
    }
    .frame .topGuide{
      position:absolute;
      left:0; right:0;
      top:18%;
      border-top: 2px solid rgba(255,255,255,.35);
    }

    .stepTitle{
      position:absolute;
      left:50%;
      top: 10px;
      transform:translateX(-50%);
      z-index:12;
      background: rgba(0,0,0,.55);
      border:1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      font-weight:900;
      letter-spacing:.8px;
      text-transform: uppercase;
      font-size: 14px;
      backdrop-filter: blur(8px);
      user-select:none;
    }

    .modePill{
      position:absolute;
      right: 14px;
      bottom: 110px;
      z-index:12;
      background: rgba(0,0,0,.55);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 10px 14px;
      font-weight:900;
      font-size: 14px;
      letter-spacing:.4px;
      backdrop-filter: blur(8px);
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    .modePill.active{
      background: rgba(34,197,94,.20);
      border-color: rgba(34,197,94,.55);
    }

    .hudPill{
      position:absolute;
      right: 12px;
      top: 54px;
      z-index:14;
      background: rgba(0,0,0,.45);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 10px;
      font-weight: 900;
      font-size: 12px;
      letter-spacing:.2px;
      backdrop-filter: blur(8px);
      user-select:none;
    }
    .torchPill{
      position:absolute;
      left: 12px;
      top: 54px;
      z-index:14;
      width: 40px;
      height: 40px;
      border-radius: 999px;
      background: rgba(0,0,0,.45);
      border: 1px solid var(--border);
      color: var(--fg);
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight: 900;
      font-size: 16px;
      backdrop-filter: blur(8px);
      opacity: .92;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    .torchPill.on{
      background: rgba(34,197,94,.22);
      border-color: rgba(34,197,94,.55);
      opacity: 1;
    }

    .closePill{
      position:absolute;
      right: 12px;
      top: 10px;
      z-index:14;
      width: 40px;
      height: 40px;
      border-radius: 999px;
      background: rgba(0,0,0,.45);
      border: 1px solid var(--border);
      color: var(--fg);
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight: 900;
      font-size: 18px;
      backdrop-filter: blur(8px);
      opacity: .92;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    .closePill:active{ transform: scale(.98); }

    #status{
      position:absolute;
      left:12px;
      bottom: 120px;
      z-index:12;
      background: rgba(0,0,0,.35);
      border:1px solid var(--border);
      border-radius: 12px;
      padding: 8px 10px;
      font-size: 12px;
      color: var(--muted);
      backdrop-filter: blur(8px);
      max-width: 74vw;
      user-select:none;
      white-space: pre-line;
    }

    .shutter{
      position:absolute;
      left:50%;
      bottom: 24px;
      transform:translateX(-50%);
      z-index:12;
      width:84px;
      height:84px;
      border-radius:999px;
      border:4px solid rgba(255,255,255,.95);
      background: rgba(255,255,255,.10);
      box-shadow: 0 10px 30px rgba(0,0,0,.45);
      -webkit-tap-highlight-color: transparent;
    }
    .shutter:active{ transform: translateX(-50%) scale(.98); }

    .review{
      position: fixed;
      left:0; right:0;
      bottom:0;
      z-index:30;
      background: rgba(0,0,0,.82);
      border-top:1px solid var(--border);
      backdrop-filter: blur(10px);
      padding: 12px 12px calc(14px + env(safe-area-inset-bottom));
      transform: translateY(105%);
      transition: transform .18s ease;
    }
    .review.open{ transform: translateY(0); }

    .review h3{
      margin: 0 0 10px 0;
      font-size: 14px;
      letter-spacing:.4px;
      text-transform: uppercase;
      opacity:.9;
    }

    .grid{ display:flex; gap:10px; }
    .card{
      flex:1;
      background: rgba(17,24,39,.55);
      border:1px solid var(--border);
      border-radius: 14px;
      padding: 10px;
      min-width:0;
    }
    .card b{ font-size: 12px; display:block; margin-bottom:8px; opacity:.95 }
    .card img{
      width:100%;
      aspect-ratio: 5/7;
      object-fit: cover;
      border-radius: 12px;
      border:1px solid rgba(255,255,255,.12);
      background:#000;
    }

    .actions{
      display:flex;
      gap:10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    button{
      appearance:none;
      border: 1px solid var(--border);
      background: rgba(17,24,39,.88);
      color: var(--fg);
      padding: 16px 16px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 900;
      min-height: 56px;
      flex:1;
      -webkit-tap-highlight-color: transparent;
    }
    button.primary{
      background: rgba(34,197,94,.20);
      border-color: rgba(34,197,94,.55);
    }
    button.danger{
      background: rgba(239,68,68,.18);
      border-color: rgba(239,68,68,.55);
    }
    button:disabled{ opacity:.45; }

    .hidden{ display:none !important; }
  </style>
</head>

<body>
<div class="app">
  <header>
    <h2>Scan carte NFL</h2>
    <div class="sub">Recto / Verso</div>
  </header>

  <div class="viewer" id="viewer">
    <video id="video" autoplay muted playsinline></video>

    <div class="stepTitle" id="stepTitle">FRONT OF CARD</div>

    <div class="frame mode-card" id="frame" aria-hidden="true">
      <div class="topGuide"></div>
    </div>

    <div class="hudPill hidden" id="zoomHud">1.0×</div>
    <div class="torchPill hidden" id="torchPill" role="button" aria-label="Torche">⚡</div>
    <div class="closePill" id="closePill" role="button" aria-label="Fermer">✕</div>

    <div id="status">Appuie sur le bouton capture pour démarrer (autorise la caméra si demandé).</div>

    <div class="modePill" id="modePill">RAW</div>

    <button class="shutter" id="shutter" title="Capturer" aria-label="Capturer"></button>
  </div>
</div>

<div class="review" id="review" aria-hidden="true">
  <h3>Vérification avant envoi</h3>

  <div class="grid">
    <div class="card">
      <b>Recto</b>
      <img id="frontPreview" alt="Recto">
    </div>
    <div class="card">
      <b>Verso</b>
      <img id="backPreview" alt="Verso">
    </div>
  </div>

  <div class="actions">
    <button id="retakeFront">Reprendre recto</button>
    <button id="retakeBack">Reprendre verso</button>
  </div>

  <div class="actions">
    <button id="send" class="primary" disabled>Envoyer</button>
    <button id="closeReview" class="danger">Annuler</button>
  </div>
</div>

<script>
  const WEBHOOK_URL = "https://n8n.srv1119117.hstgr.cloud/webhook/scan-carte-nfl";

  let stream = null, track = null, caps = null;
  let frontBlob = null, backBlob = null;

  let step = "front";
  let captureMode = "card";
  let isSending = false;

  let zoomMin = 1, zoomMax = 1, zoomStep = 0.1;
  let currentZoom = 1;

  let torchOn = false;
  let pinchStartDist = null;
  let pinchStartZoom = 1;

  const $ = (id) => document.getElementById(id);

  function haptic(ms = 16){
    try {
      if (navigator.vibrate) navigator.vibrate(ms);
    } catch(e) {}
  }

  function setStatus(msg){
    $("status").textContent = msg;
  }

  function appendStatus(msg){
    $("status").textContent = $("status").textContent + "\n" + msg;
  }

  function setStep(s){
    step = s;
    $("stepTitle").textContent = (step === "front") ? "FRONT OF CARD" : "BACK OF CARD";
    setStatus(
      step === "front"
        ? "Cadre le RECTO puis appuie sur capture."
        : "Cadre le VERSO puis appuie sur capture."
    );
  }

  function setCaptureMode(mode){
    captureMode = mode;
    $("frame").className = "frame " + (mode === "slab" ? "mode-slab" : "mode-card");
    $("modePill").textContent = (mode === "slab") ? "GRADED" : "RAW";
    $("modePill").classList.toggle("active", mode === "slab");
  }

  function clamp(v, min, max){
    return Math.max(min, Math.min(max, v));
  }

  function distance(t1, t2){
    const dx = t1.clientX - t2.clientX;
    const dy = t1.clientY - t2.clientY;
    return Math.hypot(dx, dy);
  }

  async function setZoom(z){
    if (!track || !caps || typeof caps.zoom === "undefined") return;

    const snapped = Math.round((z - zoomMin) / zoomStep) * zoomStep + zoomMin;
    currentZoom = clamp(snapped, zoomMin, zoomMax);

    $("zoomHud").textContent = `${currentZoom.toFixed(1)}×`;

    try {
      await track.applyConstraints({ advanced: [{ zoom: currentZoom }] });
    } catch(e) {}
  }

  async function startCamera(){
    if (stream) return;

    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" } },
        audio: false
      });
    } catch (e) {
      setStatus("Erreur caméra : " + (e.message || e));
      alert("Erreur caméra : " + (e.message || e));
      return;
    }

    $("video").srcObject = stream;
    track = stream.getVideoTracks()[0];
    caps = track.getCapabilities ? track.getCapabilities() : null;

    if (caps && typeof caps.zoom !== "undefined"){
      zoomMin = caps.zoom.min ?? 1;
      zoomMax = caps.zoom.max ?? 1;
      zoomStep = caps.zoom.step ?? 0.1;
      currentZoom = zoomMin;

      $("zoomHud").classList.remove("hidden");
      $("zoomHud").textContent = `${currentZoom.toFixed(1)}×`;

      try {
        await track.applyConstraints({ advanced: [{ zoom: currentZoom }] });
      } catch(e) {}
    } else {
      $("zoomHud").classList.add("hidden");
    }

    if (caps && typeof caps.torch !== "undefined"){
      $("torchPill").classList.remove("hidden");
      $("torchPill").classList.remove("on");
      torchOn = false;
    } else {
      $("torchPill").classList.add("hidden");
    }

    setStep("front");
    setStatus("Caméra OK. Mode: " + (captureMode === "slab" ? "GRADED" : "RAW") + ". Capture recto.");
  }

  async function stopCamera(){
    try {
      if (track && caps && typeof caps.torch !== "undefined" && torchOn){
        await track.applyConstraints({ advanced: [{ torch: false }] });
      }
    } catch(e) {}

    torchOn = false;

    try {
      if (stream) stream.getTracks().forEach(t => t.stop());
    } catch(e) {}

    stream = null;
    track = null;
    caps = null;
    $("video").srcObject = null;

    $("torchPill").classList.remove("on");
    $("torchPill").classList.add("hidden");
    $("zoomHud").classList.add("hidden");

    setStatus("Caméra coupée.");
  }

  async function captureCroppedBlob(){
    const video = $("video");
    const frame = $("frame");
    const viewer = $("viewer");

    if (!video.videoWidth || !video.videoHeight) return null;

    const vW = video.videoWidth;
    const vH = video.videoHeight;
    const viewerRect = viewer.getBoundingClientRect();
    const frameRect = frame.getBoundingClientRect();

    const containerW = viewerRect.width;
    const containerH = viewerRect.height;

    const scale = Math.max(containerW / vW, containerH / vH);
    const dispW = vW * scale;
    const dispH = vH * scale;
    const offsetX = (containerW - dispW) / 2;
    const offsetY = (containerH - dispH) / 2;

    const fx = frameRect.left - viewerRect.left;
    const fy = frameRect.top - viewerRect.top;
    const fW = frameRect.width;
    const fH = frameRect.height;

    let sx = (fx - offsetX) / scale;
    let sy = (fy - offsetY) / scale;
    let sW = fW / scale;
    let sH = fH / scale;

    sx = Math.max(0, Math.min(vW - 1, sx));
    sy = Math.max(0, Math.min(vH - 1, sy));
    sW = Math.max(1, Math.min(vW - sx, sW));
    sH = Math.max(1, Math.min(vH - sy, sH));

    const outMax = 1400;
    const ratio = sW / sH;
    let outW, outH;

    if (ratio >= 1){
      outW = outMax;
      outH = Math.round(outMax / ratio);
    } else {
      outH = outMax;
      outW = Math.round(outMax * ratio);
    }

    const canvas = document.createElement("canvas");
    canvas.width = outW;
    canvas.height = outH;

    const ctx = canvas.getContext("2d", { alpha: false });
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(video, sx, sy, sW, sH, 0, 0, outW, outH);

    return new Promise(resolve => canvas.toBlob(blob => resolve(blob), "image/jpeg", 0.9));
  }

  function openReview(){
    $("review").classList.add("open");
    $("review").setAttribute("aria-hidden", "false");

    $("frontPreview").src = frontBlob ? URL.createObjectURL(frontBlob) : "";
    $("backPreview").src = backBlob ? URL.createObjectURL(backBlob) : "";

    $("send").disabled = !(frontBlob && backBlob) || isSending;
  }

  function closeReview(){
    $("review").classList.remove("open");
    $("review").setAttribute("aria-hidden", "true");
  }

  async function onCapture(){
    if (!stream){
      await startCamera();
      haptic(10);
      return;
    }

    const blob = await captureCroppedBlob();
    if (!blob) {
      setStatus("Capture impossible.");
      alert("Capture impossible.");
      return;
    }

    if (step === "front"){
      frontBlob = blob;
      setStep("back");
      haptic(18);
    } else {
      backBlob = blob;
      haptic(22);
      openReview();
      setStatus("Vérifie les 2 photos puis envoie.");
    }
  }

  async function send(){
    if (!frontBlob || !backBlob) {
      setStatus("Erreur : il manque le recto ou le verso.");
      alert("Erreur : il manque le recto ou le verso.");
      return;
    }

    if (isSending) {
      setStatus("Envoi déjà en cours.");
      alert("Envoi déjà en cours.");
      return;
    }

    isSending = true;

    const btn = $("send");
    const oldText = btn.textContent;

    btn.disabled = true;
    btn.textContent = "Envoi…";
    $("closeReview").disabled = true;
    $("retakeFront").disabled = true;
    $("retakeBack").disabled = true;

    setStatus("Début envoi…");
    appendStatus("URL : " + WEBHOOK_URL);

    try {
      const form = new FormData();
      form.append("front", frontBlob, "front.jpg");
      form.append("back", backBlob, "back.jpg");
      form.append("capture_mode", captureMode);

      appendStatus("FormData OK");
      appendStatus("Envoi fetch…");

      const res = await fetch(WEBHOOK_URL, {
        method: "POST",
        body: form
      });

      appendStatus("Réponse HTTP reçue : " + res.status);

      const text = await res.text();
      console.log("Réponse webhook =", text);
      appendStatus("Lecture réponse OK");

      if (!res.ok) {
        throw new Error("HTTP " + res.status + " - " + text);
      }

      closeReview();
      setStatus("Envoyé ✅\nStatus HTTP : " + res.status);
      frontBlob = null;
      backBlob = null;
      setStep("front");
      haptic(25);

    } catch(e) {
      console.error("Erreur envoi =", e);
      const msg = e && e.message ? e.message : String(e);
      setStatus("Erreur d’envoi : " + msg);
      alert("Erreur d’envoi : " + msg);
      btn.disabled = false;
    } finally {
      btn.textContent = oldText;
      $("closeReview").disabled = false;
      $("retakeFront").disabled = false;
      $("retakeBack").disabled = false;
      isSending = false;
    }
  }

  const viewerEl = $("viewer");

  viewerEl.addEventListener("touchstart", (e) => {
    if (e.touches.length === 2){
      pinchStartDist = distance(e.touches[0], e.touches[1]);
      pinchStartZoom = currentZoom;
    }
  }, { passive: true });

  viewerEl.addEventListener("touchmove", (e) => {
    if (e.touches.length === 2 && pinchStartDist){
      e.preventDefault();
      const d = distance(e.touches[0], e.touches[1]);
      const ratio = d / pinchStartDist;
      setZoom(pinchStartZoom * ratio);
    }
  }, { passive: false });

  viewerEl.addEventListener("touchend", (e) => {
    if (e.touches.length < 2) pinchStartDist = null;
  }, { passive: true });

  let lastTap = 0;
  viewerEl.addEventListener("touchend", () => {
    const now = Date.now();
    if (now - lastTap < 260){
      setZoom(zoomMin);
    }
    lastTap = now;
  }, { passive: true });

  $("shutter").addEventListener("click", onCapture);

  $("modePill").addEventListener("click", () => {
    setCaptureMode(captureMode === "slab" ? "card" : "slab");
    haptic(10);
  });

  $("torchPill").addEventListener("click", async () => {
    if (!track || !caps || typeof caps.torch === "undefined") return;

    torchOn = !torchOn;
    $("torchPill").classList.toggle("on", torchOn);

    try {
      await track.applyConstraints({ advanced: [{ torch: torchOn }] });
      haptic(10);
    } catch(e) {
      torchOn = false;
      $("torchPill").classList.remove("on");
      haptic(25);
    }
  });

  $("closePill").addEventListener("click", async () => {
    closeReview();
    frontBlob = null;
    backBlob = null;
    setStep("front");
    await stopCamera();

    isSending = false;
    $("send").textContent = "Envoyer";
    $("send").disabled = true;
    $("closeReview").disabled = false;
    $("retakeFront").disabled = false;
    $("retakeBack").disabled = false;

    setStatus("Caméra coupée. Appuie sur capture pour relancer.");
    haptic(12);
  });

  $("retakeFront").addEventListener("click", () => {
    closeReview();
    frontBlob = null;
    setStep("front");
    setStatus("Reprise recto : cadre le recto puis capture.");
  });

  $("retakeBack").addEventListener("click", () => {
    closeReview();
    backBlob = null;
    setStep("back");
    setStatus("Reprise verso : cadre le verso puis capture.");
  });

  $("closeReview").addEventListener("click", () => {
    closeReview();
    setStatus("Review annulée. Tu peux reprendre une capture.");
  });

  $("send").addEventListener("click", send);

  setCaptureMode("card");
  setStep("front");
  setStatus("Appuie sur le bouton capture pour démarrer (autorise la caméra si demandé).");
</script>
</body>
</html>
