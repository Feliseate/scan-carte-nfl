<!doctype html>
<html lang="fr">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Scan carte NFL</title>
  <style>
    :root{
      --bg:#0b0c10;
      --fg:#f3f4f6;
      --muted: rgba(243,244,246,.75);
      --accent:#22c55e;
      --danger:#ef4444;
      --border: rgba(255,255,255,.18);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      height: 100dvh;
      overflow:hidden;
    }
    header{
      padding: 10px 14px env(safe-area-inset-top);
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:space-between;
      background: linear-gradient(to bottom, rgba(0,0,0,.65), rgba(0,0,0,0));
      position: relative;
      z-index: 5;
    }
    header h2{
      margin:0;
      font-size: 16px;
      font-weight: 700;
    }
    .app{
      height: 100dvh;
      display:flex;
      flex-direction:column;
    }
    .viewer{
      position: relative;
      flex: 1 1 auto;
      min-height: 55dvh;
      overflow:hidden;
      background:#000;
    }
    video{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit: cover;
      transform: translateZ(0);
    }

    .frame{
      position:absolute;
      left:50%;
      top:50%;
      transform: translate(-50%,-50%);
      border: 2px solid rgba(255,255,255,.85);
      border-radius: 14px;
      box-shadow: 0 0 0 9999px rgba(0,0,0,.35);
      pointer-events:none;
    }
    .frame:after{
      content:"";
      position:absolute;
      inset:10px;
      border:1px dashed rgba(255,255,255,.35);
      border-radius: 10px;
    }
    /* Raw card ~ trading card ratio */
    .frame.mode-card{
      width: min(88vw, 440px);
      aspect-ratio: 5 / 7;
    }
    /* Slab PSA (complete) */
    .frame.mode-slab{
      width: min(78vw, 380px);
      aspect-ratio: 10 / 16;
    }

    .controls{
      flex: 0 0 auto;
      padding: 10px 12px calc(12px + env(safe-area-inset-bottom));
      background: rgba(0,0,0,.65);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
    }
    .row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      justify-content:space-between;
      margin: 8px 0;
    }
    button{
      appearance:none;
      border: 1px solid var(--border);
      background: rgba(17,24,39,.85);
      color: var(--fg);
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 650;
      flex: 1 1 auto;
      min-width: 120px;
    }
    button.primary{ background: rgba(34,197,94,.2); border-color: rgba(34,197,94,.5); }
    button.danger{ background: rgba(239,68,68,.18); border-color: rgba(239,68,68,.5); }
    button:disabled{ opacity:.45; }

    .slider{
      width:100%;
      display:flex;
      gap:10px;
      align-items:center;
      background: rgba(17,24,39,.55);
      border: 1px solid var(--border);
      padding: 10px 12px;
      border-radius: 12px;
    }
    .slider label{
      font-size: 13px;
      color: var(--muted);
      min-width: 48px;
    }
    .slider input[type="range"]{ width:100%; }
    .slider .val{
      font-variant-numeric: tabular-nums;
      font-size: 13px;
      min-width: 50px;
      text-align:right;
    }

    .previews{
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:space-between;
    }
    .thumb{
      flex: 1 1 0;
      background: rgba(17,24,39,.55);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px;
      display:flex;
      gap:8px;
      align-items:center;
      min-height: 74px;
    }
    .thumb img{
      width: 56px;
      height: 56px;
      object-fit: cover;
      border-radius: 10px;
      border:1px solid rgba(255,255,255,.2);
      background:#0b0c10;
    }
    .thumb .meta{ display:flex; flex-direction:column; gap:4px; min-width:0; }
    .thumb .meta b{ font-size: 13px; }
    .thumb .meta span{
      font-size: 12px;
      color: var(--muted);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    #status{
      font-size: 13px;
      color: var(--muted);
      margin-top: 6px;
      min-height: 18px;
    }
    .ok{ color: var(--accent) !important; }
    .err{ color: var(--danger) !important; }
    .hidden{ display:none !important; }
  </style>
</head>

<body>
<div class="app">
  <header>
    <h2>Scan carte NFL</h2>
    <div style="font-size:12px;color:var(--muted)">Recto / Verso</div>
  </header>

  <div class="viewer" id="viewer">
    <video id="video" playsinline autoplay muted></video>
    <div class="frame mode-card" id="frame" aria-hidden="true"></div>
  </div>

  <div class="controls">
    <div class="row">
      <button id="start" class="primary">Ouvrir la caméra</button>
      <button id="stop" class="danger" disabled>Couper</button>
    </div>

    <div class="row">
      <button id="mode" disabled>Mode: Carte</button>
      <button id="torch" disabled class="hidden">Flash: OFF</button>
      <button id="resetZoom" disabled class="hidden">Zoom: Reset</button>
    </div>

    <div class="row">
      <div class="slider hidden" id="zoomWrap">
        <label for="zoom">Zoom</label>
        <input id="zoom" type="range" min="1" max="1" step="0.1" value="1" />
        <div class="val" id="zoomVal">1.0×</div>
      </div>
    </div>

    <div class="row">
      <button id="snapFront" disabled>Capturer Recto</button>
      <button id="snapBack" disabled>Capturer Verso</button>
      <button id="send" disabled class="primary">Envoyer</button>
    </div>

    <div class="previews">
      <div class="thumb">
        <img id="frontPreview" alt="Recto" />
        <div class="meta">
          <b>Recto</b>
          <span id="frontInfo">—</span>
        </div>
      </div>
      <div class="thumb">
        <img id="backPreview" alt="Verso" />
        <div class="meta">
          <b>Verso</b>
          <span id="backInfo">—</span>
        </div>
      </div>
    </div>

    <div id="status"></div>
  </div>
</div>

<script>
  const WEBHOOK_URL = "https://n8n.srv1119117.hstgr.cloud/webhook-test/scan-carte-nfl";

  let stream = null;
  let track = null;
  let caps = null;

  let frontBlob = null;
  let backBlob = null;

  let torchOn = false;

  const MODES = [
    { key: "card", label: "Carte", className: "mode-card" },
    { key: "slab", label: "Slab PSA", className: "mode-slab" },
  ];
  let modeIndex = 0;

  const $ = (id) => document.getElementById(id);
  const statusEl = $("status");

  function setStatus(msg, cls="") {
    statusEl.className = cls;
    statusEl.textContent = msg;
  }

  function canUseCamera() {
    return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  }

  function currentMode() {
    return MODES[modeIndex];
  }

  function applyMode() {
    const frame = $("frame");
    MODES.forEach(m => frame.classList.remove(m.className));
    frame.classList.add(currentMode().className);
    $("mode").textContent = "Mode: " + currentMode().label;
    setStatus("Mode cadrage: " + currentMode().label + " (crop = zone du cadre).", "ok");
  }

  async function startCamera() {
    try {
      setStatus("Ouverture caméra…");
      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: "environment" },
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        },
        audio: false
      });

      $("video").srcObject = stream;
      track = stream.getVideoTracks()[0];
      caps = (track && track.getCapabilities) ? track.getCapabilities() : null;

      $("stop").disabled = false;
      $("snapFront").disabled = false;
      $("snapBack").disabled = false;
      $("mode").disabled = false;

      setupZoomUI();
      setupTorchUI();
      applyMode();

      setStatus("Caméra active. Place carte/slab dans le cadre puis capture recto/verso.", "ok");
    } catch (e) {
      console.error(e);
      setStatus("Impossible d’ouvrir la caméra. Vérifie les permissions navigateur.", "err");
    }
  }

  async function stopCamera() {
    // Torch off avant de couper (évite certains bugs)
    try {
      if (track && caps && typeof caps.torch !== "undefined" && torchOn) {
        torchOn = false;
        $("torch").textContent = "Flash: OFF";
        await applyAdvancedConstraints({ torch: false });
      }
    } catch {}

    try { if (stream) stream.getTracks().forEach(t => t.stop()); } catch {}
    stream = null; track = null; caps = null;

    $("video").srcObject = null;

    $("stop").disabled = true;
    $("snapFront").disabled = true;
    $("snapBack").disabled = true;
    $("send").disabled = true;
    $("mode").disabled = true;

    hideZoomUI();
    hideTorchUI();

    setStatus("Caméra coupée.");
  }

  function hideZoomUI(){
    $("zoomWrap").classList.add("hidden");
    $("resetZoom").classList.add("hidden");
    $("resetZoom").disabled = true;
  }
  function hideTorchUI(){
    $("torch").classList.add("hidden");
    $("torch").disabled = true;
    torchOn = false;
    $("torch").textContent = "Flash: OFF";
  }

  function setupZoomUI() {
    if (!track || !caps || typeof caps.zoom === "undefined") {
      hideZoomUI();
      return;
    }
    const min = caps.zoom.min ?? 1;
    const max = caps.zoom.max ?? 1;
    const step = caps.zoom.step ?? 0.1;

    const zoom = $("zoom");
    zoom.min = String(min);
    zoom.max = String(max);
    zoom.step = String(step);
    zoom.value = String(min);

    $("zoomVal").textContent = `${Number(zoom.value).toFixed(1)}×`;

    $("zoomWrap").classList.remove("hidden");
    $("resetZoom").classList.remove("hidden");
    $("resetZoom").disabled = false;

    zoom.oninput = async () => {
      $("zoomVal").textContent = `${Number(zoom.value).toFixed(1)}×`;
      await applyAdvancedConstraints({ zoom: Number(zoom.value) });
    };

    $("resetZoom").onclick = async () => {
      zoom.value = String(min);
      $("zoomVal").textContent = `${Number(zoom.value).toFixed(1)}×`;
      await applyAdvancedConstraints({ zoom: Number(zoom.value) });
    };
  }

  function setupTorchUI() {
    if (!track || !caps || typeof caps.torch === "undefined") {
      hideTorchUI();
      return;
    }
    const torchBtn = $("torch");
    torchBtn.classList.remove("hidden");
    torchBtn.disabled = false;

    torchBtn.onclick = async () => {
      torchOn = !torchOn;
      torchBtn.textContent = torchOn ? "Flash: ON" : "Flash: OFF";
      await applyAdvancedConstraints({ torch: torchOn });
    };
  }

  async function applyAdvancedConstraints(advancedObj) {
    try {
      if (!track) return;
      await track.applyConstraints({ advanced: [ advancedObj ] });
    } catch (e) {
      console.warn("applyConstraints failed", e);
    }
  }

  async function captureCroppedBlob() {
    const video = $("video");
    const frame = $("frame");
    const viewer = $("viewer");

    if (!video.videoWidth || !video.videoHeight) return null;

    const vW = video.videoWidth;
    const vH = video.videoHeight;

    const viewerRect = viewer.getBoundingClientRect();
    const frameRect = frame.getBoundingClientRect();

    const containerW = viewerRect.width;
    const containerH = viewerRect.height;

    const scale = Math.max(containerW / vW, containerH / vH);
    const dispW = vW * scale;
    const dispH = vH * scale;

    const offsetX = (containerW - dispW) / 2;
    const offsetY = (containerH - dispH) / 2;

    const fx = frameRect.left - viewerRect.left;
    const fy = frameRect.top  - viewerRect.top;
    const fW = frameRect.width;
    const fH = frameRect.height;

    let sx = (fx - offsetX) / scale;
    let sy = (fy - offsetY) / scale;
    let sW = fW / scale;
    let sH = fH / scale;

    sx = Math.max(0, Math.min(vW - 1, sx));
    sy = Math.max(0, Math.min(vH - 1, sy));
    sW = Math.max(1, Math.min(vW - sx, sW));
    sH = Math.max(1, Math.min(vH - sy, sH));

    const outMax = 1400;
    const ratio = sW / sH;
    let outW, outH;
    if (ratio >= 1) { outW = outMax; outH = Math.round(outMax / ratio); }
    else { outH = outMax; outW = Math.round(outMax * ratio); }

    const canvas = document.createElement("canvas");
    canvas.width = outW;
    canvas.height = outH;
    const ctx = canvas.getContext("2d", { alpha:false });
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(video, sx, sy, sW, sH, 0, 0, outW, outH);

    return new Promise(resolve => {
      canvas.toBlob(blob => resolve(blob), "image/jpeg", 0.9);
    });
  }

  async function snapFront() {
    const blob = await captureCroppedBlob();
    if (!blob) { setStatus("Capture impossible. Caméra pas prête.", "err"); return; }
    frontBlob = blob;
    $("frontPreview").src = URL.createObjectURL(blob);
    $("frontInfo").textContent = `OK (${Math.round(blob.size/1024)} KB)`;
    setStatus("Recto capturé. Capture le verso.", "ok");
    $("send").disabled = !(frontBlob && backBlob);
  }

  async function snapBack() {
    const blob = await captureCroppedBlob();
    if (!blob) { setStatus("Capture impossible. Caméra pas prête.", "err"); return; }
    backBlob = blob;
    $("backPreview").src = URL.createObjectURL(blob);
    $("backInfo").textContent = `OK (${Math.round(blob.size/1024)} KB)`;
    setStatus("Verso capturé. Tu peux envoyer.", "ok");
    $("send").disabled = !(frontBlob && backBlob);
  }

  async function send() {
    if (!frontBlob || !backBlob) {
      setStatus("Il faut recto + verso avant d’envoyer.", "err");
      return;
    }

    try {
      setStatus("Envoi en cours…");
      const form = new FormData();

      form.append("front", frontBlob, "front.jpg");
      form.append("back", backBlob, "back.jpg");

      // 👇 Info utile côté n8n pour adapter l’analyse
      form.append("capture_mode", currentMode().key); // "card" | "slab"

      const res = await fetch(WEBHOOK_URL, { method: "POST", body: form });
      if (!res.ok) throw new Error("HTTP " + res.status);

      const text = await res.text();
      setStatus("Envoyé ✅ Réponse n8n: " + text, "ok");

      frontBlob = null; backBlob = null;
      $("frontPreview").src = ""; $("backPreview").src = "";
      $("frontInfo").textContent = "—"; $("backInfo").textContent = "—";
      $("send").disabled = true;

    } catch (e) {
      console.error(e);
      setStatus("Erreur d’envoi vers n8n. Vérifie l’URL webhook / CORS.", "err");
    }
  }

  $("start").addEventListener("click", startCamera);
  $("stop").addEventListener("click", stopCamera);
  $("snapFront").addEventListener("click", snapFront);
  $("snapBack").addEventListener("click", snapBack);
  $("send").addEventListener("click", send);

  $("mode").addEventListener("click", () => {
    modeIndex = (modeIndex + 1) % MODES.length;
    applyMode();
  });

  if (!canUseCamera()) {
    setStatus("Ton navigateur ne supporte pas l’accès caméra. Essaie Chrome sur Android.", "err");
  } else {
    setStatus("Clique “Ouvrir la caméra”, puis choisis le mode (Carte / Slab PSA).");
  }
</script>
</body>
</html>
